<!-- Facebook-style Create Post Modal -->
<div class="create-post-modal">
  <div class="modal-header">
    <h2>Tạo bài viết</h2>
    <button class="close-btn" (click)="onCancel()">
      <i class="bi bi-x"></i>
    </button>
  </div>

  <div class="modal-content">
    <!-- User Info -->
    <div class="user-info">
      <div class="user-avatar">
        <img [src]="getImageUrl(currentUser?.avatar)" 
             [alt]="currentUser?.name || 'User'"
             (error)="onImageError($event)">
      </div>
      <div class="user-details">
        <h4>{{ currentUser?.name || currentUser?.username || 'Người dùng' }}</h4>
        <div class="privacy-selector">
          <i class="bi bi-globe"></i>
          <span>Công khai</span>
        </div>
      </div>
    </div>

    <!-- Post Content -->
    <form (ngSubmit)="onSubmit()" #postForm="ngForm">
      <!-- Error Message -->
      <div class="error-message" *ngIf="error">
        <i class="bi bi-exclamation-triangle"></i>
        {{ error }}
      </div>

      <!-- Main Text Area -->
      <div class="content-area">
        <textarea 
          name="content"
          class="post-textarea"
          placeholder="Chia sẻ bài viết của bạn..."
          [(ngModel)]="post.content"
          maxlength="5000"
          rows="4"
          required></textarea>
      </div>

      <!-- Multiple Images Preview -->
      <div class="images-preview-container" *ngIf="imagePreviews.length > 0">
        <div class="images-preview-header">
          <span class="images-count">{{ imagePreviews.length }}/5 ảnh</span>
          <button type="button" class="remove-all-images" (click)="removeAllImages()" title="Xóa tất cả ảnh">
            <i class="bi bi-trash"></i>
            Xóa tất cả
          </button>
        </div>
        
        <div class="images-grid" [class.single-image]="imagePreviews.length === 1" 
                                 [class.two-images]="imagePreviews.length === 2"
                                 [class.three-images]="imagePreviews.length === 3"
                                 [class.four-images]="imagePreviews.length === 4"
                                 [class.five-images]="imagePreviews.length === 5">
          <div class="image-preview-item" *ngFor="let imagePreview of imagePreviews; trackBy: trackByImageId">
            <img [src]="imagePreview.preview" [alt]="imagePreview.file.name">
            <button type="button" class="remove-image" (click)="removeImage(imagePreview.id)" 
                    [title]="'Xóa ảnh ' + imagePreview.file.name">
              <i class="bi bi-x"></i>
            </button>
            <div class="image-name">{{ imagePreview.file.name }}</div>
          </div>
        </div>
      </div>

      <!-- Add to Post -->
      <div class="add-to-post">
        <span class="add-label">Thêm ảnh vào bài viết của bạn</span>
        <div class="add-options">
          <!-- Photo Upload -->
          <input type="file" id="photoInput" accept="image/*" multiple
                 (change)="onFileSelected($event)" style="display: none;">
          <button type="button" class="add-btn photo-btn" 
                  (click)="triggerFileInput()" 
                  [disabled]="imagePreviews.length >= 5"
                  [title]="imagePreviews.length >= 5 ? 'Đã đạt tối đa 5 ảnh' : 'Thêm ảnh (tối đa 5 ảnh)'">
            <i class="bi bi-plus-circle-fill"></i>
            <span class="upload-text">{{ imagePreviews.length }}/5</span>
          </button>
          
          <!-- Removed other options - only keep photo upload -->
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="post-btn" 
              [disabled]="isSubmitting || !post.content.trim()">
        <span *ngIf="!isSubmitting">Đăng</span>
        <span *ngIf="isSubmitting">
          <i class="bi bi-arrow-repeat spin"></i>
          Đang đăng...
        </span>
      </button>
    </form>
  </div>
</div>
