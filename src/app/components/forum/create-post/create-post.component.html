<!-- Facebook-style Create Post Modal -->
<div class="create-post-modal">
  <div class="modal-header">
    <h2>Tạo bài viết</h2>
    <button class="close-btn" (click)="onCancel()">
      <i class="bi bi-x"></i>
    </button>
  </div>

  <div class="modal-content">
    <!-- User Info -->
    <div class="user-info">
      <div class="user-avatar">
        <img [src]="getImageUrl(currentUser?.avatar)" 
             [alt]="currentUser?.name || 'User'"
             (error)="onImageError($event)">
      </div>
      <div class="user-details">
        <h4>{{ currentUser?.name || currentUser?.username || 'Người dùng' }}</h4>
        <div class="privacy-selector">
          <i class="bi bi-globe"></i>
          <span>Công khai</span>
        </div>
      </div>
    </div>

    <!-- Post Content -->
    <form (ngSubmit)="onSubmit()" #postForm="ngForm">
      <!-- Error Message -->
      <div class="error-message" *ngIf="error">
        <i class="bi bi-exclamation-triangle"></i>
        {{ error }}
      </div>

      <!-- Main Text Area -->
      <div class="content-area">
        <textarea 
          name="content"
          class="post-textarea"
          placeholder="Chia sẻ bài viết của bạn..."
          [(ngModel)]="post.content"
          maxlength="5000"
          rows="4"
          required></textarea>
      </div>

      <!-- Image Preview -->
      <div class="image-preview" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Preview">
        <button type="button" class="remove-image" (click)="removeImage()">
          <i class="bi bi-x"></i>
        </button>
      </div>

      <!-- Add to Post -->
      <div class="add-to-post">
        <span class="add-label">Thêm vào bài viết của bạn</span>
        <div class="add-options">
          <!-- Photo Upload -->
          <input type="file" id="photoInput" accept="image/*" 
                 (change)="onFileSelected($event)" style="display: none;">
          <button type="button" class="add-btn photo-btn" 
                  (click)="triggerFileInput()" title="Ảnh/Video">
            <i class="bi bi-image"></i>
          </button>
          
          <!-- Removed other options - only keep photo upload -->
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="post-btn" 
              [disabled]="isSubmitting || !post.content.trim()">
        <span *ngIf="!isSubmitting">Đăng</span>
        <span *ngIf="isSubmitting">
          <i class="bi bi-arrow-repeat spin"></i>
          Đang đăng...
        </span>
      </button>
    </form>
  </div>
</div>
