<div class="shorts-page-container">
  <div class="mona-header">
    <div class="header-left">
      <div class="mona-logo">
        <span class="logo-text">AI6 SHORTS</span>
      </div>
    </div>
    <div class="header-right">
      <button class="close-button" (click)="goBack()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <div class="shorts-content" *ngIf="!loading; else loadingTemplate">
    <div class="shorts-carousel-wrapper">
      <div class="shorts-carousel-container">
        <div class="shorts-carousel">
          <div
            class="shorts-track"
            [style.transform]="getSlideTransform()"
            (mousedown)="onMouseDown($event)"
            (mousemove)="onMouseMove($event)"
            (mouseup)="onMouseUp($event)"
            (mouseleave)="onMouseUp($event)"
            (touchstart)="onTouchStart($event)"
            (touchmove)="onTouchMove($event)"
            (touchend)="onTouchEnd($event)"
            [class.dragging]="isDragging"
          >
            <div
              class="short-card"
              *ngFor="let short of shorts; let i = index; trackBy: trackById"
              [class.active]="i === currentIndex"
              [class.inactive]="i !== currentIndex"
              (click)="onVideoClick(i)"
            >
              <div class="short-video-container">
                <!-- Video Loading State -->
                <div 
                  class="video-loading" 
                  *ngIf="i === currentIndex && isVideoLoading(short.id!)"
                >
                  <div class="loading-spinner"></div>
                  <p>Đang tải video...</p>
                </div>

                <!-- Main Video Element -->
                <video
                  *ngIf="i === currentIndex && !isVideoLoading(short.id!)"
                  [src]="getShortVideoUrl(short)"
                  [id]="'video-' + short.id"
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="metadata"
                  (loadstart)="onVideoLoadStart(short)"
                  (loadeddata)="onVideoLoaded(short)"
                  (canplay)="onVideoCanPlay(short)"
                  (play)="onVideoPlay(short)"
                  (pause)="onVideoPause(short)"
                  (ended)="onVideoEnded(short.id!)"
                  (error)="onVideoError(short)"
                  (timeupdate)="onVideoTimeUpdate($event, short)"
                  class="short-video"
                  #videoElement
                ></video>

                <!-- Video Controls Overlay -->
                <div 
                  class="video-controls-overlay" 
                  *ngIf="i === currentIndex && !isVideoLoading(short.id!)"
                  (click)="toggleVideoPlayPause(short.id!)"
                >
                  <div class="play-pause-button" [class.show]="!isVideoPlaying(short.id!)">
                    <i class="bi bi-play-fill"></i>
                  </div>
                  
                  <!-- Volume Control -->
                  <div class="volume-control">
                    <button 
                      class="volume-button" 
                      (click)="toggleMute(short.id!); $event.stopPropagation()"
                    >
                      <i [class]="getVolumeIcon(short.id!)"></i>
                    </button>
                  </div>

                  <!-- Progress Bar -->
                  <div class="progress-container">
                    <div class="progress-bar">
                      <div 
                        class="progress-fill" 
                        [style.width.%]="getVideoProgress(short.id!)"
                      ></div>
                    </div>
                  </div>

                  <!-- Fullscreen Button -->
                  <div class="fullscreen-control">
                    <button 
                      class="fullscreen-button" 
                      (click)="toggleFullscreen(short.id!); $event.stopPropagation()"
                    >
                      <i class="bi bi-fullscreen"></i>
                    </button>
                  </div>
                </div>

                <!-- Video Error State -->
                <div 
                  class="video-error" 
                  *ngIf="i === currentIndex && hasVideoError(short.id!)"
                >
                  <i class="bi bi-exclamation-triangle"></i>
                  <p>Không thể tải video</p>
                  <button 
                    class="retry-button" 
                    (click)="retryVideo(short)"
                  >
                    Thử lại
                  </button>
                </div>

                <!-- Thumbnail for inactive videos -->
                <img
                  *ngIf="i !== currentIndex"
                  [src]="getShortThumbnailUrl(short)"
                  (error)="onShortImageError($event)"
                  [alt]="short.title"
                  class="short-thumbnail"
                />

                <!-- Preload next video -->
                <video
                  *ngIf="shouldPreloadVideo(i)"
                  [src]="getShortVideoUrl(short)"
                  preload="metadata"
                  muted
                  style="display: none;"
                  (loadeddata)="onVideoPreloaded(short)"
                ></video>
              </div>

              <div class="mona-card-footer">
                <div class="card-text">{{ short.title }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button
        class="carousel-arrow left"
        (click)="prevShorts()"
        [disabled]="!canPrevShorts()"
        [class.disabled]="!canPrevShorts()"
        title="Video trước"
      >
        <i class="bi bi-chevron-left"></i>
      </button>

      <button
        class="carousel-arrow right"
        (click)="nextShorts()"
        [disabled]="!canNextShorts()"
        [class.disabled]="!canNextShorts()"
        title="Video tiếp theo"
      >
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>

    <div class="carousel-dots">
      <span
        *ngFor="let short of shorts; let i = index; trackBy: trackById"
        class="dot"
        [class.active]="i === currentIndex"
        (click)="onVideoClick(i)"
        [title]="'Video ' + (i + 1) + ': ' + short.title"
      ></span>
    </div>
  </div>

  <ng-template #loadingTemplate>
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p>Đang tải shorts...</p>
    </div>
  </ng-template>
</div>
