<!-- Notification Bell Icon -->
<div class="notification-container">
  <button class="notification-bell" (click)="togglePanel()" [class.has-unread]="unreadCount > 0">
    <i class="bi bi-bell">🔔</i>
    <span class="notification-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Notification Panel -->
  <div class="notification-panel" *ngIf="showPanel">
    <!-- Panel Header -->
    <div class="panel-header">
      <h4>Thông báo</h4>
      <div class="header-actions">
        <button 
          class="mark-all-read-btn" 
          (click)="markAllAsRead()" 
          [disabled]="loading || unreadCount === 0"
          title="Đánh dấu tất cả đã đọc">
          <i class="bi bi-check2-all"></i>
        </button>
        <button class="close-btn" (click)="closePanel()">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <!-- Notifications List -->
    <div class="notifications-list">
      <div 
        class="notification-item" 
        *ngFor="let notification of notifications; trackBy: trackByNotificationId"
        [class.unread]="!notification.isRead"
        (click)="onNotificationClick(notification)"
        [routerLink]="notification.actionUrl">
        
        <!-- Notification Icon -->
        <div class="notification-icon" [style.background-color]="getNotificationColor(notification.type)">
          <i [class]="getNotificationIcon(notification.type)"></i>
        </div>

        <!-- Notification Content -->
        <div class="notification-content">
          <div class="notification-title">{{ notification.title }}</div>
          <div class="notification-message">{{ notification.message }}</div>
          <div class="notification-time">{{ getTimeAgo(notification.createdAt) }}</div>
        </div>

        <!-- Actor Avatar -->
        <div class="notification-avatar" *ngIf="notification.actorAvatar">
          <img [src]="notification.actorAvatar" [alt]="notification.actorName">
        </div>
        <div class="notification-avatar placeholder" *ngIf="!notification.actorAvatar">
          <i class="bi bi-person-circle"></i>
        </div>

        <!-- Delete Button -->
        <button 
          class="delete-btn" 
          (click)="deleteNotification(notification, $event)"
          title="Xóa thông báo">
          <i class="bi bi-x"></i>
        </button>

        <!-- Unread Indicator -->
        <div class="unread-dot" *ngIf="!notification.isRead"></div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="notifications.length === 0">
        <div class="empty-icon">
          <i class="bi bi-bell-slash"></i>
        </div>
        <div class="empty-title">Không có thông báo</div>
        <div class="empty-message">Các thông báo mới sẽ xuất hiện ở đây</div>
      </div>
    </div>

    <!-- Panel Footer -->
    <div class="panel-footer" *ngIf="notifications.length > 0">
      <a routerLink="/notifications" class="view-all-link" (click)="closePanel()">
        Xem tất cả thông báo
      </a>
    </div>
  </div>
</div>
