<div class="update-user-dialog-orange">
  <div class="dialog-header-orange">
    <h5 class="header-title-orange">Cập nhật tài khoản</h5>
    <button class="close-button-orange" (click)="closeDialog()" aria-label="Close dialog">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div class="dialog-body-orange">
    <div class="form-group-orange">
      <label for="name-input" class="form-label-orange">
        <i class="bi bi-person-fill"></i> Tên
      </label>
      <input type="text" id="name-input" class="form-control-orange" name="name" placeholder="Nhập tên người dùng" [(ngModel)]="name">
    </div>
    <div class="form-group-orange">
      <label for="email-input" class="form-label-orange">
        <i class="bi bi-envelope-fill"></i> Email
      </label>
      <input type="email" id="email-input" class="form-control-orange" name="email" placeholder="Nhập địa chỉ email" [(ngModel)]="email">
    </div>
  </div>
  <div class="dialog-footer-orange">
    <button class="btn-cancel-orange" (click)="closeDialog()">Hủy bỏ</button>
    <button class="btn-primary-orange" (click)="updateUser()">
      <i class="bi bi-save-fill"></i> Cập nhật
    </button>
  </div>
</div>
